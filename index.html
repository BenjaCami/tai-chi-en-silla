<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Tai Chi en Silla</title>
<style>
:root { --azul:#2b7fa1; --terra:#b5523b; --verde:#2f8a3c; --rojo:#c7362b; --fondo:#f6f3ee; --tinta:#1f2430; --gris:#5d6272; --borde:#ddd8cf; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--fondo); color:var(--tinta); font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:22px; line-height:1.45; }
main { max-width:640px; margin:0 auto; padding:14px 16px 130px; }
h1 { font-size:31px; line-height:1.18; margin:8px 0 12px; }
h2 { font-size:25px; margin:24px 0 10px; }
p { margin:0 0 12px; }
.grande { font-size:25px; }
.suave { color:var(--gris); font-size:20px; }
.btn { display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; min-height:76px; border:0; border-radius:22px;
       font-size:25px; font-weight:800; color:#fff; background:var(--azul); margin:0 0 8px; padding:14px 18px; cursor:pointer; text-decoration:none; text-align:center; font-family:inherit; }
.btn small { font-size:18px; font-weight:500; opacity:.95; margin-top:3px; }
.btn.verde { background:var(--verde); min-height:96px; font-size:28px; } .btn.terra { background:var(--terra); } .btn.rojo { background:var(--rojo); }
.btn.claro { background:#fff; color:var(--tinta); border:3px solid var(--borde); }
.explica { font-size:19px; color:var(--gris); margin:0 4px 18px; }
.tarjeta { background:#fff; border:2px solid var(--borde); border-radius:20px; padding:14px; margin:0 0 12px; display:flex; gap:14px; align-items:center; color:inherit; text-decoration:none; }
.tarjeta svg { width:80px; height:96px; flex:none; }
.tarjeta b { font-size:23px; display:block; line-height:1.2; }
.chip { display:inline-block; background:#e7ecf1; border-radius:30px; padding:3px 14px; font-size:19px; margin:4px 6px 2px 0; font-weight:600; }
.cuidado { display:flex; gap:14px; align-items:center; background:#fff; border:2px solid var(--borde); border-radius:18px; padding:14px; margin-bottom:10px; font-size:22px; }
.cuidado .e { font-size:40px; flex:none; width:52px; text-align:center; }
.caja { border-radius:18px; padding:14px 16px; margin:10px 0; font-size:21px; }
.caja.amarilla { background:#fff4d6; border:3px solid #f5b301; } .caja.verde { background:#e9f6e9; border:3px solid var(--verde); }
.caja.roja { background:#fdeceb; border:3px solid var(--rojo); } .caja.azul { background:#e6f2f8; border:3px solid var(--azul); }
.top { position:sticky; top:0; z-index:5; background:var(--fondo); display:flex; align-items:center; gap:10px; padding:10px 0 8px; }
.volver { min-height:60px; border-radius:16px; border:3px solid var(--borde); background:#fff; font-size:23px; font-weight:800; cursor:pointer; padding:0 18px; font-family:inherit; color:var(--tinta); }
.pasos-num { counter-reset:n; padding:0; list-style:none; } .pasos-num li { counter-increment:n; position:relative; padding:4px 0 0 58px; min-height:46px; margin-bottom:12px; }
.pasos-num li::before { content:counter(n); position:absolute; left:0; top:0; width:44px; height:44px; border-radius:50%; background:var(--azul); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; }
.fig { background:#fff; border:2px solid var(--borde); border-radius:22px; padding:6px; }
.fig svg { width:100%; height:min(36vh,360px); display:block; }
.reloj { font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; }
.barra { height:16px; background:#e2ddd5; border-radius:10px; overflow:hidden; margin:6px 0 10px; } .barra i { display:block; height:100%; background:var(--verde); transition:width .9s linear; }
.respira { display:block; text-align:center; font-weight:800; border-radius:16px; padding:8px 12px; font-size:22px; margin:8px 0; }
.inh { background:#e3f0fb; color:#245d9e; } .exh { background:#fdefe2; color:#a8521a; }
.controles { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:2px solid var(--borde); padding:10px 10px calc(10px + env(safe-area-inset-bottom));
             display:grid; grid-template-columns:1fr 1.5fr 1fr; gap:8px; z-index:9; }
.controles button { min-height:84px; border-radius:20px; border:0; font-size:19px; font-weight:800; cursor:pointer; line-height:1.15; font-family:inherit; }
.c-gris { background:#eceae5; color:var(--tinta); } .c-azul { background:var(--azul); color:#fff; font-size:23px !important; }
.mal { min-height:60px; border-radius:16px; border:0; background:var(--rojo); color:#fff; font-size:19px; font-weight:800; padding:0 14px; cursor:pointer; font-family:inherit; }
.grilla { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.dia { min-height:78px; border-radius:14px; border:3px solid var(--borde); background:#fff; font-size:15px; line-height:1.15; padding:4px 2px;
       text-align:center; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--tinta); font-family:inherit; }
.dia.hecho { background:var(--verde); border-color:var(--verde); color:#fff; } .dia.desc { background:#efece6; color:var(--gris); }
.dia.hoy { border:4px solid var(--rojo); } .dia big { font-size:25px; }
.velo { position:fixed; inset:0; background:rgba(20,22,30,.55); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
.hoja { background:var(--fondo); width:100%; max-width:640px; border-radius:26px 26px 0 0; padding:22px 16px calc(20px + env(safe-area-inset-bottom)); max-height:92vh; overflow:auto; }
.puntos { display:flex; gap:6px; justify-content:center; margin:6px 0 14px; } .puntos i { width:14px; height:14px; border-radius:50%; background:#d6d1c8; } .puntos i.si { background:var(--azul); }
.reto { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.dr { position:relative; background:#fff; border:3px solid var(--borde); border-radius:16px; padding:4px 2px 6px; text-align:center; font-family:inherit;
      font-weight:800; font-size:18px; color:var(--tinta); cursor:pointer; }
.dr svg { width:100%; height:80px; display:block; }
.dr.hecho { background:#e9f6e9; border-color:var(--verde); } .dr.hoy { border:4px solid var(--rojo); box-shadow:0 0 0 4px #f6c9c4; }
.dr .cand { position:absolute; inset:0; border-radius:13px; background:rgba(238,236,231,.35); display:flex; align-items:center; justify-content:center; font-size:30px; }
.dr .marca { position:absolute; top:4px; right:4px; width:30px; height:30px; border-radius:50%; background:var(--verde); color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center; }
.dr .hoyb { position:absolute; top:-12px; left:50%; transform:translateX(-50%); background:var(--rojo); color:#fff; font-size:14px; border-radius:10px; padding:1px 9px; }
.cuenta { font-size:150px; font-weight:900; text-align:center; color:var(--verde); line-height:1; margin:30px 0; }
</style></head>

=\"1\" /><line x1=\"123.0\" y1=\"99.0\" x2=\"152.5\" y2=\"93.8\" stroke=\"#2b7fa1\" stroke-width=\"13\" stroke-linecap=\"round\" opacity=\"1\" /><line x1=\"152.5\" y1=\"93.8\" x2=\"178.9\" y2=\"84.2\" stroke=\"#f1c6a3\" stroke-width=\"10.5\" stroke-linecap=\"round\" opacity=\"1\" /><circle cx=\"178.9\" cy=\"84.2\" r=\"6.6\" fill=\"#f1c6a3\" opacity=\"1\" /><line x1=\"178.9\" y1=\"84.2\" x2=\"184.5\" y2=\"82.2\" stroke=\"#f1c6a3\" stroke-width=\"7\" stroke-linecap=\"round\" opacity=\"1\" /></svg>", "F": {"prueba": "Hola. Así suena la voz que te va a acompañar en tus ejercicios.", "encendida": "La voz está encendida.", "preparar": "Prepárate. Siéntate en la silla, con los pies en el suelo y la espalda derecha. Cuando estés listo, toca el botón verde.", "3": "Tres.", "2": "Dos.", "1": "Uno.", "pausa": "Pausa. Toca seguir cuando quieras.", "mal": "Para ahora. Quédate sentado y respira tranquilo. Si te duele el pecho, llama al uno tres uno.", "fin": "¡Muy bien! Terminaste tus ejercicios. Quédate sentado y respira tranquilo un momento.", "finDia": "¡Muy bien! Terminaste el día de hoy. Quédate sentado y respira tranquilo un momento. Mañana te espera el día siguiente."}, "voz": {"Hola. Así suena la voz que te va a acompañar en tus ejercicios.": "voz/43d4ff408b.mp3", "La voz está encendida.": "voz/b8b1428c2a.mp3", "Prepárate. Siéntate en la silla, con los pies en el suelo y la espalda derecha. Cuando estés listo, toca el botón verde.": "voz/746a589b6b.mp3", "Tres.": "voz/d7f848501f.mp3", "Dos.": "voz/edd44d5995.mp3", "Uno.": "voz/f1bce3555d.mp3", "Pausa. Toca seguir cuando quieras.": "voz/6e8bce1ac3.mp3", "Para ahora. Quédate sentado y respira tranquilo. Si te duele el pecho, llama al uno tres uno.": "voz/2d2c2592c2.mp3", "¡Muy bien! Terminaste tus ejercicios. Quédate sentado y respira tranquilo un momento.": "voz/831818b8bf.mp3", "¡Muy bien! Terminaste el día de hoy. Quédate sentado y respira tranquilo un momento. Mañana te espera el día siguiente.": "voz/0b12a15b3c.mp3", "🌬️ Toma aire por la nariz": "voz/3e5ab78942.mp3", "💨 Bota el aire por la boca": "voz/45b3a9c16b.mp3", "Respirar como un globo.": "voz/3ddeb13f77.mp3", "Pon las dos manos sobre tu barriga.": "voz/901a15f3b4.mp3", "Toma aire por la nariz, despacio. Cuenta 1, 2, 3, 4. Tu barriga se infla como un globo.": "voz/4f7d2e486a.mp3", "Bota el aire por la boca, despacio. Cuenta hasta 6. Tu barriga se desinfla.": "voz/836e6717d0.mp3", "Círculos con los hombros.": "voz/645f98e9a0.mp3", "Deja los brazos sueltos. Las manos sobre las piernas.": "voz/f7dcb0811d.mp3", "Sube los hombros hacia las orejas. Despacio.": "voz/cdc7caa170.mp3", "Lleva los hombros hacia atrás y bájalos. Como si dibujaras un círculo.": "voz/60c07920d6.mp3", "Decir sí y no con la cabeza.": "voz/bd6e4e7a17.mp3", "Baja un poco la cabeza, como diciendo «sí». Vuelve al centro.": "voz/cc390c3ab3.mp3", "Mira despacio hacia un hombro. Solo hasta donde estés cómodo.": "voz/d5242aae90.mp3", "Vuelve al centro. Ahora mira hacia el otro hombro.": "voz/eccdbffd21.mp3", "Muñecas y dedos.": "voz/7ec0ecf231.mp3", "Pon los brazos adelante, a la altura del pecho. Los codos un poco doblados.": "voz/0edd1f916d.mp3", "Haz círculos lentos con las muñecas.": "voz/1ab6a87b50.mp3", "Abre y cierra los dedos 5 veces. Después baja las manos a las piernas.": "voz/f5d9c199c0.mp3", "Mover los tobillos.": "voz/cbd1cf2dbc.mp3", "Estira un poco una pierna. Lleva la punta del pie hacia ti.": "voz/a3744afdc6.mp3", "Ahora lleva la punta del pie hacia adelante. Como si pisaras un pedal.": "voz/e6b0537ab6.mp3", "Baja el pie al suelo. Ahora haz lo mismo con el otro pie.": "voz/2a6b659fe8.mp3", "Frotar las manos.": "voz/97ddc49aa1.mp3", "Junta las manos frente al pecho. Frótalas 10 segundos.": "voz/20bf6c991c.mp3", "Sepáralas un poco, despacio. Siente el calor.": "voz/8732795221.mp3", "Acércalas sin tocarlas. Como si apretaras una pelota de aire.": "voz/c1f1cbefa0.mp3", "Comienzo.": "voz/eecbe7c190.mp3", "Siéntate derecho. Las manos sobre las piernas." let audioActual = null;
function hablarSistema(t) {
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(t.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, ""));
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => /es[-_](CL|419|US|MX|AR)/i.test(x.lang)) || vs.find(x => /^es/i.test(x.lang));
  if (v) u.voice = v;
  u.lang = v ? v.lang : "es-CL"; u.rate = 0.85;
  speechSynthesis.speak(u);
}
// Dice una frase o una lista de frases. Usa los audios grabados (Fish Audio); si falta alguno, la voz del teléfono.
function hablar(t) {
  if (!voz) return;
  const partes = (Array.isArray(t) ? t : [t]).filter(Boolean);
  callar();
  if (!partes.every(x => D.voz[x])) return hablarSistema(partes.join(" "));
  let i = 0;
  const siguiente = () => {
    if (i >= partes.length) { audioActual = null; return; }
    const a = new Audio(D.voz[partes[i++]]);
    audioActual = a;
    a.onended = () => { if (audioActual === a) siguiente(); };
    a.play().catch(() => { if (audioActual === a) { audioActual = null; hablarSistema(partes.slice(i - 1).join(" ")); } });
  };
  siguiente();
}
function callar() { if (audioActual) { audioActual.pause(); audioActual = null; } if ("speechSynthesis" in window) speechSynthesis.cancel(); }

function isoDe(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

  let k = 0, paso = 0, quedan = 0, enPausa = false, lock = null, tick = null, enPaso = 0;
  const PASO_SEG = 10;
  if ("wakeLock" in navigator) navigator.wakeLock.request("screen").then(l => lock = l).catch(() => {});
  function cargar() { quedan = D.ejercicios[r.ej[k].id].seg; paso = 0; enPaso = 0; pintar(true); }
  function pintar(hablarAhora) {
    const e = D.ejercicios[r.ej[k].id], p = e.pasos[paso], total = e.seg;
    const sig = k + 1 < r.ej.length ? D.ejercicios[r.ej[k + 1].id].titulo : "Terminar 🎉";
    const mm = Math.floor(quedan / 60), ss = String(quedan % 60).padStart(2, "0");
    app.innerHTML = `<div class="top"><button class="volver" onclick="salirReproductor()">✕ Salir</button>
        <span style="flex:1"></span><button class="mal" onclick="meSientoMal()">😣 Me siento mal</button></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="suave"><b>Ejercicio ${k + 1} de ${r.ej.length}</b></span>
        <span class="reloj">${enPausa ? "⏸ " : ""}Quedan ${mm}:${ss}</span></div>
      <div class="barra"><i style="width:${100 * (1 - quedan / total)}%"></i></div>
      <h1 style="margin:0 0 4px;font-size:29px">${e.titulo}</h1>
      <div class="suave">Paso ${paso + 1} de ${e.pasos.length} · Repite: ${r.ej[k].rep}</div>
      ${p.resp ? `<span class="respira ${p.resp == "Inhala" ? "inh" : "exh"}">${D.resp[p.resp]}</span>` : ""}
      ${k === 0 && paso < 2 ? `<div class="caja azul" style="font-size:18px;padding:8px 12px;margin:6px 0">👀 Haz lo mismo que el dibujo. La <b style="color:#e07a1f">flecha naranja</b> te muestra hacia dónde mover.</div>` : ""}
      <div class="fig" style="margin-top:6px">${p.svg}</div>
      <p style="font-size:25px;margin:10px 0 6px;font-weight:700;line-height:1.35">${p.tx}</p>
      <p class="suave">Después: <b>${sig}</b></p>
      <div class="controles"><button class="c-gris" onclick="reproductor.atras()">⏮<br>Volver</button>
        <button class="c-azul" onclick="reproductor.pausa()">${enPausa ? "▶ Seguir" : "⏸ Parar<br>un rato"}</button>
        <button class="c-gris" onclick="reproductor.siguiente()">⏭<br>Pasar</button></div>`;
    if (hablarAhora) hablar([paso === 0 ? e.titulo + "." : null, p.tx, p.resp ? D.resp[p.resp] : null]);
  }
  function fin() {
    clearInterval(tick); if (lock) lock.release().catch(() => {});
    let marca = "";
    if (dia) {
      const h = retoHechos(); if (!h.includes(dia)) { h.push(dia); LS.set("reto", h); }
      marca = `<div class="caja verde" style="text-align:center"><b style="font-size:26px">✅ ¡Día ${dia} listo!</b><br>Llevas ${h.length} de 28 días.${dia < 28 ? ` Mañana te espera el Día ${dia + 1} 🔓` : " 🏆 ¡Terminaste el reto!"}</div>`;
    }
    hablar(dia ? D.F.finDia : D.F.fin);
    app.innerHTML = `<h1 style="margin-top:30px;text-align:center;font-size:40px">🎉 ¡Muy bien!</h1>
      <p class="grande" style="text-align:center">Terminaste <b>${r.titulo}</b>.</p>${marca}
      <div class="caja amarilla">Quédate sentado un momento. Respira tranquilo antes de pararte.</div>
      <a class="btn verde" href="#reto">🏆 Ver mi reto</a><a class="btn claro" href="#inicio">Volver al inicio</a>`;
    reproductor = null;
  }
  tick = setInterval(() => {
    if (enPausa) return;
    quedan--; enPaso++;
    const e = D.ejercicios[r.ej[k].id];
    if (quedan <= 0) { if (k + 1 < r.ej.length) { k++; cargar(); } else fin(); return; }
    if (enPaso >= PASO_SEG) { enPaso = 0; paso = (paso + 1) % e.pasos.length; pintar(true); } else pintar(false);
  }, 1000);
  reproductor = {
    pausa() { enPausa = !enPausa; if (enPausa) { callar(); hablar(D.F.pausa); } pintar(false); },
    pausar() { enPausa = true; callar(); pintar(false); },
    siguiente() { if (k + 1 < r.ej.length) { k++; cargar(); } else fin(); },
    atras() { if (k > 0) k--; cargar(); },
    parar() { clearInterval(tick); if (lock) lock.release().catch(() => {}); callar(); }
  };
  cargar();
}
function salirReproductor() {
  if (reproductor) reproductor.pausar();
  abrirHoja(`<h1>¿Quieres salir?</h1><p class="grande">Si sales ahora, los ejercicios se detienen.</p>
    <button class="btn" onclick="cerrarHoja();if(reproductor)reproductor.pausa()">▶ No, seguir</button>
    <button class="btn claro" onclick="cerrarHoja();if(reproductor)reproductor.parar();reproductor=null;ir('#inicio')">Sí, salir</button>`);
}
function meSientoMal() {
  if (reproductor) reproductor.pausar();
  hablar(D.F.mal);
  abrirHoja(`<h1>😣 Para ahora</h1>
    <ol class="pasos-num grande"><li>Quédate <b>sentado</b>.</li><li><b>Respira tranquilo</b>, por la nariz.</li><li><b>No sigas</b> con ese ejercicio.</li></ol>
    <div class="caja roja"><b>Si te duele el pecho</b>, te falta mucho el aire o te vas a desmayar: <b>llama al 131</b> o pide ayuda a alguien.</div>
    <a class="btn rojo" href="tel:131">📞 Llamar al 131</a>
    <button class="btn" onclick="cerrarHoja();if(reproductor)reproductor.siguiente()">Ya estoy bien · pasar al siguiente</button>
    <button class="btn claro" onclick="cerrarHoja();if(reproductor)reproductor.parar();reproductor=null;ir('#inicio')">Terminar por hoy</button>`);
}

// ------------------------------------------------------------------ reto de 28 días
function reto() {
  const n = D.niveles[nivelReto()], h = retoHechos(), d = diaActual();
  let tiles = "";
  for (let k = 1; k <= 28; k++) {
    const hecho = h.includes(k), hoy = k === d, cerrado = !hecho && !hoy;
    tiles += `<button class="dr ${hecho ? "hecho" : ""} ${hoy ? "hoy" : ""}" onclick="tocarReto(${k})">${hoy ? `<span class="hoyb">HOY</span>` : ""}
      ${miniDia(k)}Día ${k}${hecho ? `<span class="marca">✓</span>` : ""}${cerrado ? `<span class="cand">🔒</span>` : ""}</button>`;
  }
  app.innerHTML = cabecera("") + `<div style="background:#fff;border:2px solid var(--borde);border-radius:20px;padding:12px;margin-bottom:12px">
      <div style="background:#eceae5;border-radius:14px;padding:10px;text-align:center;font-weight:900;font-size:24px;line-height:1.2">🏆 RETO DE 28 DÍAS<br><span style="font-size:19px;font-weight:700">Tai Chi en silla</span></div>
      <div style="display:flex;justify-content:space-between;margin-top:12px;gap:10px">
        <div><span class="suave">Tu nivel</span><br><b>${n.nombre}</b><br><a href="#" onclick="cambiarNivel();return false" style="font-size:18px">cambiar</a></div>
        <div style="text-align:right"><span class="suave">Tu avance</span><br><b style="font-size:30px">${h.length}</b> de 28 días</div></div>
      <div class="barra" style="margin-top:8px"><i style="width:${h.length / 28 * 100}%"></i></div></div>
    <div class="caja azul" style="font-size:19px">👉 Toca el día que dice <b style="color:var(--rojo)">HOY</b>.<br>✓ verde = ya lo hiciste.<br>🔒 = se abre cuando terminas el día anterior.</div>
    <div class="reto" style="margin-top:16px">${tiles}</div>`;
}
function tocarReto(k) {
  const h = retoHechos(), d = diaActual();
  if (h.includes(k)) return abrirHoja(`<h1>✓ Día ${k}: listo</h1><p class="grande">Este día ya lo hiciste. ¡Bien! 👏</p>
    <button class="btn" onclick="cerrarHoja();ir('#dia/${k}')">▶ Repetirlo</button><button class="btn claro" onclick="cerrarHoja()">Cerrar</button>`);
  if (k !== d) return abrirHoja(`<h1>🔒 Día ${k}</h1><p class="grande">Este día todavía está cerrado. Primero termina el <b>Día ${d}</b>.</p>
    <button class="btn verde" onclick="cerrarHoja();ir('#dia/${d}')">▶ Ir al Día ${d}</button><button class="btn claro" onclick="cerrarHoja()">Cerrar</button>`);
  ir(`#dia/${k}`);
}
function dia(k) {
  const i = rutinaDia(k), r = D.rutinas[i], h = retoHechos();
  app.innerHTML = cabecera(`Día ${k} de 28`, "#reto") + `<p class="grande">Hoy toca: <b>${r.titulo}</b>.</p>
    <div class="caja azul">Son <b>${r.ej.length} ejercicios</b>. Dura más o menos <b>${r.min} minutos</b>.</div>
    <a class="btn verde" href="#preparar/${i}/${k}">▶ Empezar el Día ${k}</a>
    ${h.includes(k) ? "" : `<button class="btn claro" onclick="marcarDia(${k})">✓ Ya lo hice sin la app<small>Marcar el día como listo</small></button>`}
    <h2>Lo que vas a hacer:</h2>` + r.ej.map((x, n) => { const e = D.ejercicios[x.id];
      return `<a class="tarjeta" href="#ej/${x.id}">${e.mini}<div><span class="suave">${n + 1}.</span><b>${e.titulo}</b><span class="chip">🔁 ${x.rep}</span></div></a>`; }).join("");
}
function marcarDia(k) { const h = retoHechos(); if (!h.includes(k)) h.push(k); LS.set("reto", h); ir("#reto"); }
function cambiarNivel() {
  abrirHoja(`<h1>Cambiar mi nivel</h1><p class="suave">Tus días hechos no se borran.</p>` + D.niveles.map((n, i) =>
    `<button class="btn ${["verde", "", "terra"][i]}" onclick="LS.set('plan',{nivel:${i},inicio:hoyISO()});cerrarHoja();reto()">${n.nombre}<small>${n.para}</small></button>`).join("") +
    `<button class="btn claro" onclick="preguntarReinicio()">↺ Empezar el reto de nuevo</button>
     <button class="btn claro" onclick="cerrarHoja()">Cerrar</button>`);
}
function preguntarReinicio() {
  abrirHoja(`<h1>¿Empezar de nuevo?</h1><p class="grande">Se borran tus días hechos y vuelves al Día 1.</p>
    <button class="btn rojo" onclick="LS.set('reto',[]);cerrarHoja();reto()">Sí, empezar de nuevo</button>
    <button class="btn claro" onclick="cerrarHoja()">No</button>`);
}

// ------------------------------------------------------------------ rutas
function ruta() {
  cerrarHoja();
  const h = location.hash || "#inicio", [n, a] = h.slice(1).split("/");
  if (reproductor && n !== "jugar" && n !== "uno") { reproductor.parar(); reproductor = null; }
  window.scrollTo(0, 0);
  if (!LS.get("bienvenida", false)) return bienvenida(0);
  const c = h.slice(1).split("/")[2];
  const R = { inicio, cuidados, ayuda, rutinas, ejercicios, reto, plan: reto, dia: () => dia(+a),
              rutina: () => rutina(+a), preparar: () => preparar(+a, c ? +c : 0), jugar: () => reproducir(D.rutinas[+a], +a, c ? +c : 0),
              uno: () => reproducir({ titulo: D.ejercicios[a].titulo, ej: [{ id: a, rep: D.ejercicios[a].repite }] }, null), ej: () => ejercicio(a) };
  (R[n] || inicio)();
}
window.addEventListener("hashchange", ruta);
if ("speechSynthesis" in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; }
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
ruta();
</script></body></html>
